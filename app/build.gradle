plugins {
    id 'com.android.application'
}

// GitHub Actions passes its run number (-PbuildNumber=N) so every build has a higher versionCode
// than the last one; the app compares this with the newest release tag ("build-N") to find updates.
def buildNumber = (project.findProperty('buildNumber') ?: '1').toString().toInteger()

android {
    namespace 'com.example.edgecam'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.edgecam'
        minSdk 29
        targetSdk 35
        versionCode buildNumber
        versionName "1.${buildNumber}"
    }

    // One fixed key for every build. Android only installs an update over the existing app when
    // both are signed with the same key; the default debug key is regenerated on each CI machine.
    signingConfigs {
        shared {
            storeFile rootProject.file('keystore/edgecam.jks')
            storePassword 'edgecam-shared'
            keyAlias 'edgecam'
            keyPassword 'edgecam-shared'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external libraries: the app uses only the Android framework.
