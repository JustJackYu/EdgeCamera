plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.edgecam'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.edgecam'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external libraries: the app uses only the Android framework.
